[project]
name = "kubebreaker"
version = "0.1.0"
description = "Chaos benchmark for LLM SRE agents on a local kind cluster"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "kubernetes==37.0.2",
]

[project.scripts]
kubebreaker = "kubebreaker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cluster: needs the kind-kubebreaker cluster running"]
