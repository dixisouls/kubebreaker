[project]
name = "kubebreaker"
version = "0.1.0"
description = "Chaos benchmark for LLM SRE agents on a local kind cluster"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.6.0",
    "kubernetes==37.0.2",
    "openai==3.46.0",
    "python-dotenv==1.2.4",
    "pyyaml>=6",
]

[project.scripts]
kubebreaker = "kubebreaker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML and SVG templates read better unwrapped
"src/kubebreaker/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cluster: needs the kind-kubebreaker cluster running"]
