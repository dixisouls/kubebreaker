apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  API_URL: http://api:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: frontend
          image: kubebreaker/shop:0.1.0
          imagePullPolicy: IfNotPresent
          command: [uvicorn, shop.frontend:app, --host, 0.0.0.0, --port, "8080"]
          env:
            - name: SERVICE_NAME
              value: frontend
          envFrom:
            - configMapRef:
                name: frontend-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
