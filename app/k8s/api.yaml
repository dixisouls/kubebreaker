apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  REDIS_HOST: redis
  ORDERS_URL: http://orders:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: kubebreaker/shop:0.1.0
          imagePullPolicy: IfNotPresent
          command: [uvicorn, shop.api:app, --host, 0.0.0.0, --port, "8080"]
          env:
            - name: SERVICE_NAME
              value: api
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
