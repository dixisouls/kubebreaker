# kubebreaker local cluster. Created with: make cluster-up
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubebreaker
networking:
  # kind's default CNI (kindnet) ignores NetworkPolicy, so we install Calico instead
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
