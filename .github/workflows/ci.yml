name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Unit tests (no cluster, no API keys)
        run: uv run pytest -m "not cluster" -q

  harness-image:
    name: Build the harness image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t kubebreaker/harness:ci .
      - name: Smoke test
        run: docker run --rm kubebreaker/harness:ci faults
